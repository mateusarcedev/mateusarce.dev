name: E2E bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run smoke tests
        run: pnpm test:e2e

      - name: Restore permanent CI
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI
          
          on:
            pull_request:
            push:
              branches:
                - main
          
          permissions:
            contents: read
          
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
          
                - name: Setup pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 10.34.6
          
                - name: Setup Node
                  uses: actions/setup-node@v5
                  with:
                    node-version: 22
                    cache: pnpm
          
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
          
                - name: Lint
                  run: pnpm lint
          
                - name: Build
                  run: pnpm build
          
            e2e:
              needs: validate
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
          
                - name: Setup pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 10.34.6
          
                - name: Setup Node
                  uses: actions/setup-node@v5
                  with:
                    node-version: 22
                    cache: pnpm
          
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
          
                - name: Install Chromium
                  run: pnpm exec playwright install --with-deps chromium
          
                - name: Build
                  run: pnpm build
          
                - name: Run smoke tests
                  run: pnpm test:e2e
          
                - name: Upload Playwright report
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: playwright-report
                    path: playwright-report/
                    if-no-files-found: ignore
          
            lockfile-preview:
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
          
                - name: Setup pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 10.34.6
          
                - name: Setup Node
                  uses: actions/setup-node@v5
                  with:
                    node-version: 22
                    cache: pnpm
          
                - name: Resolve lockfile
                  run: pnpm install --lockfile-only --no-frozen-lockfile
          
                - name: Upload resolved lockfile
                  uses: actions/upload-artifact@v4
                  with:
                    name: resolved-lockfile
                    path: pnpm-lock.yaml
                    if-no-files-found: error
          
                - name: Check committed lockfile
                  run: git diff --exit-code -- pnpm-lock.yaml
          
          EOF
          sed -i 's/^          //' .github/workflows/ci.yml

      - name: Commit lockfile and CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Playwright"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
